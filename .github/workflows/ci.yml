name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Tests and Python package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Qt system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0

      - name: Install build tools
        run: python -m pip install --upgrade pip build

      - name: Install Photo Album
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: pytest

      - name: Build wheel and source distribution
        run: python -m build

      - name: Verify application icon in wheel
        shell: python
        run: |
          from pathlib import Path
          from zipfile import ZipFile

          wheels = list(Path("dist").glob("*.whl"))

          if len(wheels) != 1:
              raise SystemExit(
                  f"Expected exactly one wheel, found {len(wheels)}"
              )

          wheel = wheels[0]

          with ZipFile(wheel) as archive:
              expected = "photoalbum/resources/icons/photoalbum.svg"

              if expected not in archive.namelist():
                  raise SystemExit(
                      f"Missing application icon in {wheel.name}: "
                      f"{expected}"
                  )

          print(f"OK: {expected} found in {wheel.name}")

      - name: Upload Python packages
        uses: actions/upload-artifact@v4
        with:
          name: python-packages
          path: |
            dist/*.whl
            dist/*.tar.gz
