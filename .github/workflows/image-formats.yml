name: Image formats and frozen codecs

on:
  pull_request:
  push:
    branches: [main, feature/image-formats]
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        include:
          - os: ubuntu-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONFAULTHANDLER: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Linux Qt dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0
      - name: Install and check dependencies
        run: |
          python -m pip install ".[dev,packaging]" "Pillow==12.3.0"
          python -m pip check
      - name: Run full test suite
        run: python -m pytest -q --junitxml=test-results.xml -o faulthandler_timeout=60
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-${{ runner.os }}
          path: test-results.xml
      - name: Build distributions
        run: python -m build --no-isolation
      - name: Install built wheel
        shell: python
        run: |
          from pathlib import Path
          import subprocess, sys
          wheel, = Path("dist").glob("*.whl")
          subprocess.run([sys.executable, "-m", "pip", "install", "--force-reinstall", "--no-deps", str(wheel)], check=True)
      - name: Windows icon
        if: runner.os == 'Windows'
        run: python packaging/pyinstaller/build_windows_icon.py
      - name: Freeze both executables
        working-directory: packaging/pyinstaller
        run: python -m PyInstaller --clean --noconfirm photo-album.spec
      - name: Decode real HEIC and export PDF from both frozen applications
        run: python packaging/verify_artifact.py packaging/pyinstaller/dist/photo-album --smoke-test --heic tests/fixtures/images/orientation-6.heic

  linux-native:
    runs-on: ubuntu-latest
    env:
      PYTHONFAULTHANDLER: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install native Qt desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 xvfb xauth openbox
      - run: python -m pip install ".[dev,packaging]" "Pillow==12.3.0"
      - name: Run full suite with native styles and a window manager
        run: |
          xvfb-run -a -s "-screen 0 1600x1000x24" sh -c 'openbox >/tmp/photoalbum-openbox.log 2>&1 & exec env QT_QPA_PLATFORM=xcb python -m pytest -q --junitxml=test-results-native.xml -o faulthandler_timeout=60'
      - name: Upload native test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-Linux-native
          path: test-results-native.xml

  dependency-compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pillow: ["11.1.0", "13.0.0"]
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONFAULTHANDLER: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Linux Qt dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0
      - run: python -m pip install ".[dev]" "Pillow==${{ matrix.pillow }}"
      - run: python -m pip check
      - run: python -m pytest -q tests/test_image_formats.py tests/test_exif_reader.py tests/test_preview_image_cache.py
