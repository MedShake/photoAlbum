name: Release builds

on:
  workflow_dispatch:
  release:
    types:
      - published

jobs:
  validate-release:
    name: Validate release version
    if: github.event_name == 'release'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Check tag matches project version
        shell: python
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          import os
          import tomllib
          from pathlib import Path

          with Path("pyproject.toml").open("rb") as handle:
              version = tomllib.load(handle)["project"]["version"]

          expected_tag = f"v{version}"
          actual_tag = os.environ["RELEASE_TAG"]

          print(f"Project version : {version}")
          print(f"Release tag     : {actual_tag}")
          print(f"Expected tag    : {expected_tag}")

          if actual_tag != expected_tag:
              raise SystemExit(
                  f"Release tag {actual_tag!r} does not match "
                  f"project version {version!r}"
              )

          print("OK: release tag matches project version")

  linux:
    name: Linux application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0

      - name: Install Photo Album and packaging tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[packaging]"

      - name: Build Linux application
        working-directory: packaging/pyinstaller
        run: |
          pyinstaller --clean --noconfirm photo-album.spec

      - name: Verify application bundle
        run: |
          test -x packaging/pyinstaller/dist/photo-album/photo-album
          find packaging/pyinstaller/dist/photo-album -name photoalbum.svg -print -quit | grep -q .

      - name: Create Linux archive
        run: |
          tar -C packaging/pyinstaller/dist -czf PhotoAlbum-linux-x86_64.tar.gz photo-album

      - name: Build Debian package
        run: python packaging/debian/build_deb.py

      - name: Verify Debian package
        run: |
          dpkg-deb --info photo-album_*.deb
          dpkg-deb --contents photo-album_*.deb

      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: PhotoAlbum-debian-amd64
          path: photo-album_*.deb

      - name: Upload Linux application
        uses: actions/upload-artifact@v4
        with:
          name: PhotoAlbum-linux-x86_64
          path: PhotoAlbum-linux-x86_64.tar.gz

  windows:
    name: Windows application
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Photo Album and packaging tools
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[packaging]"

      - name: Generate Windows icon
        shell: pwsh
        run: |
          python packaging/pyinstaller/build_windows_icon.py

      - name: Build Windows application
        shell: pwsh
        working-directory: packaging/pyinstaller
        run: |
          python -m PyInstaller --clean --noconfirm photo-album.spec

      - name: Verify Windows application bundle
        shell: pwsh
        run: |
          if (-not (Test-Path "packaging/pyinstaller/dist/photo-album/photo-album.exe")) {
              throw "photo-album.exe not found"
          }

          $icon = Get-ChildItem `
              "packaging/pyinstaller/dist/photo-album" `
              -Recurse `
              -Filter "photoalbum.svg" `
              | Select-Object -First 1

          if (-not $icon) {
              throw "photoalbum.svg not found in Windows bundle"
          }

      - name: Upload Windows application
        uses: actions/upload-artifact@v4
        with:
          name: PhotoAlbum-windows-x86_64
          path: packaging/pyinstaller/dist/photo-album/

      - name: Ensure Inno Setup is available
        shell: pwsh
        run: |
          $iscc = Get-Command ISCC.exe -ErrorAction SilentlyContinue

          if (-not $iscc) {
              Write-Host "ISCC.exe not found; installing Inno Setup..."
              choco install innosetup --no-progress --yes
              $iscc = Get-Command ISCC.exe -ErrorAction SilentlyContinue
          }

          if (-not $iscc) {
              $candidates = @(
                  "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
                  "${env:ProgramFiles}\Inno Setup 6\ISCC.exe",
                  "${env:ProgramFiles}\Inno Setup 7\ISCC.exe",
                  "${env:LOCALAPPDATA}\Programs\Inno Setup 7\ISCC.exe"
              )

              $found = $candidates |
                  Where-Object { Test-Path $_ } |
                  Select-Object -First 1

              if (-not $found) {
                  throw "ISCC.exe not found after Inno Setup installation"
              }

              $inno = Split-Path $found
              $inno | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
              Write-Host "Added Inno Setup to PATH: $inno"
          }
          else {
              Write-Host "ISCC.exe available at: $($iscc.Source)"
          }

      - name: Build Windows installer
        shell: pwsh
        run: |
          python packaging/windows/build_installer.py

      - name: Verify Windows installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem "dist-installer" -Filter "PhotoAlbum-*-Windows-x64-Setup.exe"

          if (-not $installer) {
              throw "Windows installer not found"
          }

          Write-Host "Installer:"
          $installer | Format-Table Name, Length

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: PhotoAlbum-windows-installer
          path: dist-installer/*.exe

  publish:
    name: Publish release assets
    if: github.event_name == 'release'
    needs:
      - validate-release
      - linux
      - windows
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download Debian package
        uses: actions/download-artifact@v4
        with:
          name: PhotoAlbum-debian-amd64
          path: release-assets

      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: PhotoAlbum-windows-installer
          path: release-assets

      - name: Show release assets
        run: |
          find release-assets -maxdepth 2 -type f -print

      - name: Upload files to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            release-assets/*.deb \
            release-assets/*.exe \
            --clobber

