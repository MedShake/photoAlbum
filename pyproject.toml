[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "photo-album"
version = "0.1.0b1"
description = "A multilingual desktop application for creating chronological photo albums"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
authors = [
    { name = "Photo Album Contributors" }
]
dependencies = [
    "Pillow>=10.0",
    "pypdf>=5.0",
    "reportlab>=4.0",
    "PySide6>=6.6"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]


[tool.setuptools.package-data]
"photoalbum.templates.msb" = [
    "manifest.json",
    "README.md",
    "screenshots/*",
]

[project.scripts]
photo-album = "photoalbum.cli:main"
photo-album-gui = "photoalbum.gui.application:main"
pa = "photoalbum.gui.application:main"